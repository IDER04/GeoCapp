name: tests

# CI GeoCapital — exécute la suite unittest complète sur chaque push et
# chaque pull request visant main.
#
# Aucun secret n'est requis : les tests « IA » (test_ai_config,
# test_ai_chat, test_analyst) simulent les appels réseau (urlopen mocké)
# et doivent réussir SANS `OPENROUTER_API_KEY` et sans fichier `.env`
# (_absent_ du dépôt — cf. .gitignore). Le workflow n'affiche ni ne
# transforme aucune variable d'environnement ; il ne lit que le code et
# les données versionnées.
#
# Version de Python : 3.13, alignée sur l'environnement de développement
# documenté (PROJECT_CONTEXT.md — Python 3.13.5) et couvert par les
# bornes de requirements.txt (streamlit>=1.41 supporte 3.13, wheel 3.13
# disponible depuis 1.41).

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: unittest suite (3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies (requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show installed versions
        run: pip list

      # Commande établie du projet (PROJECT_CONTEXT.md §189) :
      #   python3 -m unittest discover -s tests
      # unittest retourne un code de sortie non nul en cas d'échec, ce qui
      # fait échouer le job ; les tracebacks s'affichent dans les logs.
      - name: Run test suite
        run: python -m unittest discover -s tests
